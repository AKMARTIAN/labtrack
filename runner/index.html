<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LabTrack Bench</title>
  <meta name="description" content="Walk through a lab SOP step by step: checkboxes, timers set to the protocol, and every volume calculated from your readings." />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Shares LabTrack's theme setting (same key), applied before the page paints.
    try { document.documentElement.dataset.theme = localStorage.getItem('labtrack_theme') === 'dark' ? 'dark' : 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8; --panel: #ffffff; --panel-2: #edf1f5; --input: #fcfdfe;
      --border: #dde3ea; --border-2: #c9d2dd;
      --text: #18212d; --muted: #566377; --dim: #8995a6;
      --green: #1a7f37; --cyan: #0b7285; --blue: #0969da; --amber: #9a6700; --violet: #7246c9; --red: #cf222e;
      --primary: #1f883d; --on-primary: #ffffff;
      --topbar: rgba(255, 255, 255, 0.9); --hover: #e6ebf1; --overlay: rgba(15, 23, 42, 0.34);
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 26px -18px rgba(15, 23, 42, 0.3);
      --radius: 12px;
      --font: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f14; --panel: #121821; --panel-2: #18202b; --input: #0b0f14;
      --border: #222c39; --border-2: #2e3a4a;
      --text: #dce3ec; --muted: #8492a3; --dim: #56637a;
      --green: #7ee787; --cyan: #56d4dd; --blue: #79c0ff; --amber: #f2cc60; --violet: #c4a7ff; --red: #ff7b72;
      --primary: #7ee787; --on-primary: #07210c;
      --topbar: rgba(11, 15, 20, 0.88); --hover: #1d2632; --overlay: rgba(3, 6, 10, 0.72);
      --shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.8);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.55 var(--font); }
    button, input, select, textarea { font: inherit; color: inherit; }
    b { font-weight: 700; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); } .dim { color: var(--dim); }

    /* ---------- top bar ---------- */
    .top { position: sticky; top: 0; z-index: 20; background: var(--topbar); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .top-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; max-width: 1200px; margin: 0 auto; }
    .brand { font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; text-decoration: none; color: var(--text); }
    .brand span { color: var(--cyan); font-weight: 500; }
    .run-info { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .run-info b { color: var(--text); }
    .top-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
    .progress { height: 3px; background: var(--panel-2); }
    .progress i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s ease; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; font-size: 12.5px; }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn.small { padding: 3px 8px; font-size: 12px; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--red); }
    .btn:disabled { opacity: .45; cursor: default; }

    /* ---------- layout ---------- */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px 16px 140px; }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 22px; align-items: start; }
    .nav { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 4px; }
    .nav a { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); border: 1px solid transparent; }
    .nav a:hover { background: var(--hover); }
    .nav a.cur { border-color: var(--border-2); background: var(--panel); color: var(--text); font-weight: 700; }
    .nav a.done { color: var(--green); }
    .nav .ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-2); display: grid; place-items: center; font-size: 10px; }
    .nav a.done .ring { border-color: var(--green); background: var(--green); color: var(--on-primary); }
    .nav a.cur .ring { border-color: var(--cyan); }
    .nav .cnt { font-size: 11px; color: var(--dim); }
    .nav-foot { margin-top: 12px; padding: 10px; border: 1px dashed var(--border-2); border-radius: 8px; color: var(--muted); font-size: 12px; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .nav { position: sticky; top: 56px; z-index: 10; flex-direction: row; overflow-x: auto; background: var(--bg); padding: 6px 0; margin: -6px 0 0; scrollbar-width: none; }
      .nav a { grid-template-columns: 18px auto auto; white-space: nowrap; padding: 6px 9px; }
      .nav-foot { display: none; }
    }
    @media (max-width: 520px) {
      .brand, .run-info, .top-actions .wide { display: none; }
      .top-actions .btn { padding: 6px 8px; }
      .top-actions { margin-left: auto; }
      html { scroll-padding-top: 130px; }
    }

    /* ---------- stages & steps ---------- */
    .stage { margin-bottom: 30px; }
    .stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 4px; }
    .stage-head h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
    .stage-head .tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
    .stage-head .tag.ok { color: var(--green); border-color: var(--green); }
    .stage-sum { color: var(--muted); margin: 0 0 12px; }
    .steps { display: flex; flex-direction: column; gap: 8px; }

    .step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 10px; padding: 12px 14px 12px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .step.next { border-color: var(--cyan); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 16%, transparent), var(--shadow); }
    .step.critical { border-left: 4px solid var(--red); padding-left: 7px; }
    .step.done { background: transparent; box-shadow: none; padding-top: 7px; padding-bottom: 7px; }
    .step.done .body > :not(.line) { display: none; }
    .step.done.open .body > :not(.line) { display: block; }
    .step.done .text { color: var(--muted); }
    .check { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--border-2); background: var(--input); cursor: pointer; display: grid; place-items: center; padding: 0; }
    .check:hover { border-color: var(--green); }
    .step.done .check { background: var(--green); border-color: var(--green); color: var(--on-primary); width: 26px; height: 26px; margin: 0 3px; }
    .check svg { width: 16px; height: 16px; }
    .line { display: flex; gap: 10px; align-items: baseline; }
    .num { color: var(--dim); font-size: 11.5px; min-width: 22px; }
    .text { flex: 1; }
    .meta { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
    .step.done .line { cursor: pointer; }
    .badge { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
    .badge.crit { color: var(--red); border: 1px solid var(--red); }
    .badge.need { color: var(--amber); border: 1px solid var(--amber); }

    .box { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; }
    .box.tip { background: var(--panel-2); color: var(--muted); }
    .box.warn { background: color-mix(in srgb, var(--red) 9%, transparent); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); }
    .box.stop { background: color-mix(in srgb, var(--blue) 9%, transparent); color: var(--blue); }
    .box::before { font-weight: 800; margin-right: 6px; }
    .box.tip::before { content: 'tip'; } .box.warn::before { content: '⚠'; } .box.stop::before { content: '⏸ safe stopping point:'; }

    /* tubes */
    .box.tube { background: color-mix(in srgb, var(--green) 8%, transparent); border: 1px solid color-mix(in srgb, var(--green) 28%, transparent); color: var(--text); }
    .box.tube::before { content: none; }
    .box.tube .th { font-weight: 800; margin-bottom: 6px; }
    .box.tube .th::before { content: '🏷 '; }
    .tchips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tchip { display: grid; padding: 4px 9px; border-radius: 7px; background: var(--panel); border: 1px solid var(--border-2); min-width: 92px; }
    .tchip b { font-size: 14px; letter-spacing: .02em; }
    .tchip span { font-size: 11px; color: var(--muted); }
    .tcode { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--panel-2); color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
    .tcode.keep { border-color: var(--green); color: var(--text); }
    .jt.tubes td { vertical-align: middle; } .jt.tubes td:last-child { white-space: normal; line-height: 2.1; } .jt.tubes .arrow { color: var(--dim); margin: 0 4px; }
    .samples-tbl td.tc input { width: 70px; }
    .samples-tbl td.tc input.dup { border-color: var(--red); }

    .card.redo { border: 1.5px solid var(--amber); }
    .card.redo h3 { color: var(--amber); }
    .rdos { display: grid; gap: 6px; } .rdo { display: block; font-size: 13px; }
    .tfind { display: grid; gap: 6px; margin-top: 10px; }
    .tres { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; }
    .tres b.l { font-size: 14px; } .tres.redone b.l { text-decoration: line-through; color: var(--muted); }
    .tcode.redone { text-decoration: line-through; opacity: .7; }

    .calc p.ok { color: var(--green); }
    table.plate { font-size: 10px; } table.plate td.pw { min-width: 46px; padding: 3px 4px; text-align: center; border: 1px solid var(--border); }
    table.plate td.std { background: color-mix(in srgb, var(--blue) 10%, transparent); } table.plate td.ntc { background: color-mix(in srgb, var(--amber) 14%, transparent); }
    table.plate td.lib { background: color-mix(in srgb, var(--green) 9%, transparent); }

    /* timers */
    .timers { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .timer { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 11px; border: 1px solid var(--border-2); border-radius: 999px; background: var(--input); }
    .timer .tl { color: var(--muted); font-size: 12px; }
    .timer .tv { font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
    .timer.running { border-color: var(--cyan); }
    .timer.running .tv { color: var(--cyan); }
    .timer.paused .tv { color: var(--amber); }
    .timer.done { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, transparent); }
    .timer.done .tv { color: var(--green); }
    .timer.alarm { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--green) 30%, transparent); } }
    .tbtn { border: 0; background: var(--panel-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
    .tbtn:hover { background: var(--hover); }
    .tbtn.go { background: var(--cyan); color: var(--bg); font-weight: 700; }

    /* readings */
    .readings { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
    .rd { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--input); }
    .rd .nm { flex: 1; min-width: 0; font-size: 12.5px; display: grid; gap: 2px; }
    .rd .n1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rd .n2 { display: flex; gap: 4px; flex-wrap: wrap; }
    .rd input { width: 76px; padding: 4px 6px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--panel); text-align: right; }
    .rd input:focus { outline: 2px solid var(--cyan); border-color: transparent; }
    .rd .u { font-size: 11px; color: var(--dim); }
    .rd-label { margin-top: 10px; font-size: 12px; color: var(--muted); font-weight: 700; }
    .chip { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--violet); border: 1px solid color-mix(in srgb, var(--violet) 40%, transparent); border-radius: 4px; padding: 0 4px; }

    /* calculators */
    .calc { margin-top: 10px; border: 1px solid color-mix(in srgb, var(--cyan) 35%, var(--border)); border-radius: 10px; background: color-mix(in srgb, var(--cyan) 4%, var(--panel)); overflow: hidden; }
    .calc-h { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: 11.5px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid color-mix(in srgb, var(--cyan) 20%, var(--border)); }
    .calc-h span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
    .calc-b { padding: 8px 10px; }
    .calc-b p { margin: 4px 0; }
    .tbl-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; white-space: normal; }
    th { font-size: 11px; color: var(--muted); font-weight: 700; }
    tr.tot td { font-weight: 800; border-bottom: 0; }
    td.v { font-weight: 700; font-variant-numeric: tabular-nums; }
    td.flag, .flag { color: var(--amber); font-size: 11.5px; text-align: left; white-space: normal; }
    .flag.bad { color: var(--red); }
    .big { font-size: 22px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .big small { font-size: 13px; font-weight: 500; color: var(--muted); }
    .why { color: var(--muted); font-size: 12px; }
    select.bc { padding: 2px 4px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--panel); }
    select.bc.dup { border-color: var(--red); color: var(--red); }

    /* notes */
    .note-row { margin-top: 8px; }
    .note-row textarea { width: 100%; min-height: 54px; padding: 6px 8px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--input); resize: vertical; }
    .linkish { border: 0; background: none; padding: 0; color: var(--dim); cursor: pointer; font-size: 12px; text-decoration: underline dotted; }
    .linkish:hover { color: var(--text); }

    /* ---------- setup ---------- */
    .setup { max-width: 760px; margin: 0 auto; }
    .setup h1 { font-size: 22px; letter-spacing: -0.02em; margin: 8px 0 4px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-top: 14px; }
    .card h3 { margin: 0 0 10px; font-size: 14px; }
    .proto { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px; border: 2px solid var(--cyan); border-radius: 10px; cursor: pointer; }
    .proto + .proto { margin-top: 8px; }
    .proto:not(.sel) { border-color: var(--border); }
    .proto .k { font-size: 11.5px; color: var(--muted); }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
    .field label { font-size: 11.5px; color: var(--muted); font-weight: 700; }
    .field input, .field select { padding: 7px 9px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--input); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .samples-tbl td, .samples-tbl th { text-align: left; padding: 4px 4px; }
    .samples-tbl input { width: 100%; padding: 5px 7px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--input); }
    .samples-tbl td.ix { color: var(--dim); width: 26px; }
    .samples-tbl td.q { width: 110px; }
    .samples-tbl td.b { width: 92px; }
    .samples-tbl td.x { width: 30px; }
    .err { color: var(--red); font-size: 12.5px; margin-top: 8px; }
    .how { color: var(--muted); font-size: 12.5px; }
    .how li { margin: 3px 0; }

    /* ---------- timer dock ---------- */
    .dock { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; max-width: calc(100vw - 32px); }
    .dock .timer { box-shadow: var(--shadow); background: var(--panel); cursor: pointer; }
    .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 29; }
    @media (max-width: 600px) { .fab { left: 16px; transform: none; } }

    /* ---------- dialog & toast ---------- */
    dialog { border: 1px solid var(--border-2); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 40px); box-shadow: var(--shadow); }
    dialog::backdrop { background: var(--overlay); }
    .dlg-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 800; }
    .dlg-b { padding: 14px 16px; overflow: auto; max-height: calc(100vh - 170px); }
    .dlg-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 50; background: var(--panel); border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
    .toast.ok { border-color: var(--green); }
    .toast.alarm { border-color: var(--green); background: color-mix(in srgb, var(--green) 14%, var(--panel)); font-weight: 700; }
    /* saved runs */
    .runs { display: flex; flex-direction: column; gap: 8px; }
    .run-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--input); }
    .run-row .rn { font-weight: 800; }
    .run-row .rm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .run-row .acts { display: flex; gap: 6px; align-items: center; }
    .minibar { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .minibar i { display: block; height: 100%; background: var(--green); }
    @media (max-width: 520px) { .run-row { grid-template-columns: 1fr; } }
    .step.skipped .text { text-decoration: line-through; }
    .step.skipped .check { background: var(--amber); border-color: var(--amber); font-weight: 800; }
    input.dil { width: 52px; padding: 2px 5px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--panel); text-align: right; }
    /* sample journey */
    .journey h1 { font-size: 22px; letter-spacing: -0.02em; }
    .jt td, .jt th { vertical-align: top; text-align: left; }
    .jv { font-weight: 800; font-variant-numeric: tabular-nums; }
    .js { display: block; font-size: 11px; color: var(--muted); }
    .jbad .js { color: var(--red); }
    .strip { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
    .strip .node { border: 1px solid var(--border-2); border-radius: 10px; padding: 8px 12px; background: var(--input); min-width: 140px; }
    .strip .arrow { align-self: center; color: var(--dim); }
    .jnotes { margin: 0; padding-left: 18px; } .jnotes li { margin: 4px 0; }
    @media print {
      .top, .nav, .dock, .fab, .check, .timers, .note-row .linkish { display: none !important; }
      .layout { display: block; } .step.done .body > * { display: block !important; }
      .step { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="./">LabTrack <span>bench</span></a>
      <div class="run-info" id="runInfo"></div>
      <div class="top-actions" id="topActions"></div>
    </div>
    <div class="progress"><i id="progBar"></i></div>
  </header>
  <main class="wrap" id="app"></main>
  <div class="dock" id="dock"></div>
  <dialog id="dlg"></dialog>
  <div class="toast hidden" id="toast"></div>

  <script src="protocols.js"></script>
  <script>
  (() => {
    'use strict';
    /* ================= basics ================= */
    const STORE = 'labtrack_bench_v1';        // old single-run key, moved into RUNS on first load
    const RUNS = 'labtrack_bench_runs_v1';    // { active: run id or null, runs: { id: run } }
    const PROTOCOLS = window.BENCH_PROTOCOLS || [];
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const uid = () => Math.random().toString(36).slice(2, 9);
    const num = (v) => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };

    const fv = (v) => { if (v == null || !isFinite(v)) return '–'; const a = Math.abs(v); const d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 1 ? 2 : 3; return String(+v.toFixed(d)); };

    const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    const mmss = (sec) => { sec = Math.max(0, Math.ceil(sec)); const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(sec % 60); };
    const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

    function loadDb() {
      let d = null;

      try {
        const old = JSON.parse(localStorage.getItem(STORE) || 'null');
        if (old && old.protocolId) { old.id = old.id || uid(); d.runs[old.id] = old; d.active = old.id; localStorage.setItem(RUNS, JSON.stringify(d)); localStorage.removeItem(STORE); }
      } catch (e) {}

    }
    // Older run files may miss newer fields: fill them in.
    function fixRun(r) {
      r.id = r.id || uid();
      ['readings', 'readAt', 'done', 'notes', 'timers', 'skipped', 'dil', 'choices', 'params'].forEach((k) => { if (!r[k] || typeof r[k] !== 'object') r[k] = {}; });
      r.samples = Array.isArray(r.samples) ? r.samples : [];
      r.samples.forEach((sm, i) => { if (!sm.code) sm.code = `S${i + 1}`; });

    }
    const isRun = (r) => r && typeof r === 'object' && r.protocolId && PROTOCOLS.some((p) => p.id === r.protocolId) && Array.isArray(r.samples);
    const db = loadDb();
    let state = db.active && isRun(db.runs[db.active]) ? fixRun(db.runs[db.active]) : null;
    let draft = null;            // setup form while no run is open
    let view = 'steps';          // 'steps' or 'journey'
    const openDone = new Set();  // completed steps the user expanded
    const openNotes = new Set();

    function persist() {
      try { localStorage.setItem(RUNS, JSON.stringify(db)); }
      catch (e) { toast('Could not save on this device (storage full?). Download the run file to keep it.', '', 6000); }
    }
    function save() {
      if (state) { state.updated = Date.now(); db.runs[state.id] = state; db.active = state.id; } else db.active = null;
      persist();
    }
    function openRun(id) {
      if (!isRun(db.runs[id])) return;
      state = fixRun(db.runs[id]); ensureTubeLog(state); draft = null; view = 'steps'; openDone.clear(); openNotes.clear();
      save(); render(); keepAwake();

      if (n) setTimeout(() => scrollToStep(n.id, 'auto'), 50); else { view = 'journey'; render(); }
    }
    function closeRun() {
      state = null; draft = null; view = 'steps'; save();
      if ($('dlg').open) $('dlg').close();
      render(); window.scrollTo(0, 0);
    }

    const P = () => PROTOCOLS.find((p) => p.id === (state ? state.protocolId : draft.protocolId)) || PROTOCOLS[0];
    const prm = (key) => { const v = state && state.params ? num(state.params[key]) : null; if (v != null) return v; const d = P().params.find((x) => x.key === key); return d ? d.value : null; };
    const samples = () => (state ? (scope ? state.samples.filter((s) => scope.includes(s.id)) : state.samples) : []);
    const nS = () => samples().length;

    /* ---- tubes ----
       Every transfer to a new tube gets its own label, so a tube found in a box months later says which run, sample and
       step it came from. Sample tubes: <tube code>-<suffix> (S1 → S1-ER1 → S1-ER2 → S1-ERC → S1-BC1); pool tubes:
       <run code>-<suffix>. A tube made again after a redo gets -R2, -R3… Each tube goes into state.tubeLog when its
       step is checked (label, sample, step, time, the tube it came from, and whether it was later redone). */
    const codeOf = (sm) => (sm.code || '').trim() || `S${state.samples.indexOf(sm) + 1}`;
    const runCode = (r = state) => (r.runCode || '').trim() || 'POOL';
    const stepIdx = (id) => flat().findIndex((s) => s.id === id);
    const fillBc = (t, sm) => t.replace(/\{barcode\}/g, sm && sm.barcode ? sm.barcode : 'its barcode');
    const poolIdx = () => { const i = flat().findIndex((s) => s.tube && s.tube.per === 'pool'); return i < 0 ? 1e9 : i; };
    // 1 + the redos that cover this sample (or the pool) at this step.
    function attemptOf(sid, stepId) {
      const i = stepIdx(stepId);

    }
    function tubeLabel(t, sm, stepId) {

    // The tube a sample (or the pool) is in once this step is done.

      for (const s of flat()) { if (s.tube && s.tube.per === per && !s.tube.side) { t = s.tube; at = s.id; } if (s.id === stepId) break; }
      if (!t) return per === 'pool' ? null : { label: codeOf(sm), what: 'original sample tube' };
      return { label: tubeLabel(t, sm, at), what: fillBc(t.what, sm), keep: t.keep, step: at };
    }
    // The tube going into this step: where a redo takes its new aliquot from.
    function tubeBefore(stepId, per, sm) {
      const all = flat(), i = stepIdx(stepId);

    // Where a new tube's contents come from: the main tube before this step, or the original sample (from: 'start').
    const parentOf = (step, sm) => (step.tube && step.tube.from === 'start' && sm ? { label: codeOf(sm), what: 'original sample' } : tubeBefore(step.id, step.tube ? step.tube.per : 'sample', sm));
    const dateStr = (t) => { const d = new Date(t); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear()).slice(2)}`; };
    function tubeBoxHTML(step, doneAt) {
      const t = step.tube, list = t.per === 'pool' ? [null] : samples();
      const chips = list.map((sm) => { const l = tubeLabel(t, sm, step.id), pv = parentOf(step, sm);
        return `<div class="tchip"><b>${esc(l)}</b><span>${esc(sm ? sm.name : 'pool of ' + state.samples.length + ' samples')}</span>${pv && pv.label !== l ? `<span class="dim">from ${esc(pv.label)}</span>` : ''}</div>`; }).join('');

        <div class="dim" style="margin-top:6px">${t.capOnly ? `Write the code in bold <b>on the cap only</b>: nothing on the side of the tube. (${esc(fillBc(t.what, null))}, step ${stepNo(step.id)})</div></div>` : ''}${t.noCap && !t.capOnly ? `Write the code in bold <b>on the side</b> of the tube: the caps come off before loading. ` : ''}${t.capOnly ? '' : `${t.noCap ? 'With it:' : 'Lid: the code in bold. Side:'} <b>${esc(runCode())}</b> · the code · ${esc(fillBc(t.what, list.length === 1 ? list[0] : null))} · step ${stepNo(step.id)} · ${dateStr(doneAt || Date.now())}${state.operator ? ' · ' + esc(state.operator) : ''}.${t.side && list[0] ? ` Side tube: the sample itself carries on in its main tube (${esc(tubeBefore(step.id, t.per, list[0]).label)}${list.length > 1 ? ', …' : ''}).` : ''}${t.keep ? ` <b>Keep this tube</b>${t.store ? ': ' + esc(t.store) : ': store it until the run is analysed'}.` : ''}</div></div>`}`;

    const choiceOpt = (key) => {
      const c = (P().choices || []).find((x) => x.key === key); if (!c) return null;
      return c.options.find((o) => o.value === curChoices()[key]) || c.options.find((o) => o.value === c.default) || c.options[0];
    };
    const fillP = (str, get) => str.replace(/\{p\.(\w+)(?:\*([\w.]+))?\}/g, (m, a, b) => { const x = get(a), y = b ? (/^[\d.]+$/.test(b) ? +b : get(b)) : 1; return x == null || y == null ? m : fv(x * y); });
    const fill = (str) => (typeof str !== 'string' ? str : fillP(str, prm).replace(/\{(\w+)\.(\w+)\}/g, (m, k, f) => { const o = choiceOpt(k); return o && o[f] != null ? o[f] : m; }));
    let stagesKey = '', stagesCache = null;
    function stages() {
      const key = P().id + JSON.stringify(curChoices()) + JSON.stringify(state ? state.params : {});

          : v && typeof v === 'object' && v.param ? prm(v.param) * (v.times ? prm(v.times) : 1) * (v.factor || 1) + (v.plus || 0)    // { param: 'ratio', times: 'vol', factor: n, plus: n }
          : v && typeof v === 'object' ? (v.by && choiceOpt(v.by) ? deep(v[choiceOpt(v.by).value]) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, deep(x)])))

    function toast(msg, kind = '', ms = 2600) {

    const massOf = (c) => (c.fewParam && state.samples.length <= c.fewUpTo ? prm(c.fewParam) : prm(c.massParam));

      normalise(c) {
        const mass = massOf(c);
        const rows = samples().map((s) => {
          const r = normaliseRow(c, s);
          const dilIn = `<input class="dil" inputmode="decimal" data-dil="${s.id}" value="${r.dil > 1 ? r.dil : ''}" placeholder="1" aria-label="Pre-dilution for ${esc(s.name)}" />`;

        }).join('');
        return { title: 'Normalise input', sub: `${fv(mass)} ng in ${c.finalVol} µL`,
          html: `<div class="tbl-wrap"><table><tr><th>Sample</th><th>ng/µL</th><th></th><th>pre-dil 1:</th><th>DNA µL</th><th>Water µL</th><th>ng</th></tr>${rows}</table></div>
            ${c.fewParam ? `<p class="why">${state.samples.length <= c.fewUpTo ? `${state.samples.length} sample${state.samples.length > 1 ? 's' : ''} (${c.fewUpTo} or fewer): ${fv(prm(c.fewParam))} ng each.` : `More than ${c.fewUpTo} samples: ${fv(prm(c.massParam))} ng each.`}</p>` : ''}<p class="why">Too concentrated to pipette accurately? Dilute the sample first (e.g. 1 µL + 9 µL water = 1:10), type the factor in "pre-dil" and the volumes update. Change the input mass in settings.</p>` };

      pool(c) {

      },

      input(c) {

          const flag = r.over ? `more than ${fv(c.maxVol)} µL: type a smaller volume` : r.under ? `less than ${fv(c.minVol)} µL: the SOP uses ${fv(c.minVol)}–${fv(c.maxVol)} µL` : r.ng > (c.maxNg || 1e9) ? `over ${fv(c.maxNg)} ng: use less DNA (type the µL)` : '';

      fmolNorm(c) {

            <p class="why">fmol = ng ÷ (bp × 660) × 10⁶. * = default length from settings (${fv(prm(c.lenParam))} bp): type the TapeStation size above to use the real one.${c.note ? ' ' + esc(c.note) : ''}</p>` };
      },

      lookup(c) {

        <p style="margin-top:18px"><b>Sample journey picture (.png)</b>: every sample's readings, the pool and library, and your notes, on one page.</p>
        <button class="btn" data-act="journey-png">download picture</button>
        <p style="margin-top:18px"><b>Run file (.json)</b>: the whole run as it is now (checked steps, readings, dilutions, timers, notes). Open it later or on another device to carry on where you left off.</p>
        <button class="btn" data-act="export-json">download .json</button>
        <p style="margin-top:18px"><b>Print / PDF</b>: every step with its numbers, for the paper notebook.</p>
        <button class="btn" data-act="print">print…</button>`);
    }

    /* ================= export ================= */
    function download(name, text, type) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(text instanceof Blob ? text : new Blob([text], { type })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }
    const fileBase = (r = state) => (r.runName || 'bench_run').replace(/[^a-zA-Z0-9_-]+/g, '_');
    function buildCsv() {
      const cell = (v) => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const row = (a) => a.map(cell).join(',');
      const lines = [row(['Run', state.runName]), row(['Operator', state.operator]), row(['Exported', `${isoDate(new Date())} ${hm(new Date())}`]), '',
        row(['#', 'Date', 'Time', 'Section', 'Entry', 'Type', 'Tube', 'Record', 'Result', 'Unit', 'Volume / Quantity', 'Dilution / Source', 'Note', 'Follows From'])];
      let k = 0;
      const when = (stepId, key) => { const t = state.done[stepId] || (key && state.readAt[key]) || Date.now(); const d = new Date(t); return [isoDate(d), hm(d)]; };
      const add = (stepId, key, section, entry, type, rec, result, unit, vol, note, from, tube) => lines.push(row([++k, ...when(stepId, key), section, entry, type, tube || '', rec, result, unit, vol || '', '', note || '', from || '']));
      const tubeL = (stepId, per, sm) => { const t = tubeAt(stepId, per, sm); return t ? t.label : ''; };
      let prevSampleSection = '', prevPoolSection = '';
      const log = [];  // notes go in a 'Protocol log' section after the results
      flat().forEach((s) => {
        const note = state.notes[s.id] || '';
        const fromS = prevSampleSection, fromP = prevPoolSection;   // readings in one step all follow the step before
        readingsOf(s).forEach((r, ri) => {
          if (r.noExport) return;
          const sec = r.section || r.label, type = r.type || 'General';
          if (r.per === 'pool') {
            const v = state.readings[r.key] && state.readings[r.key].pool;
            if (v != null && v !== '') { add(s.id, r.key, sec, 'Result', type, 'Pool', v, r.unit, '', ri === 0 ? note : '', r.chain === false ? '' : fromP, r.noTube ? '' : tubeL(s.id, 'pool')); if (r.chain !== false) prevPoolSection = sec; }
          } else {
            const norm = flat().find((x) => x.calc && x.calc.type === 'normalise' && x.calc.readingKey === r.key);
            samples().forEach((sm) => {
              const v = state.readings[r.key] && state.readings[r.key][sm.id];
              if (v == null || v === '') return;
              let vol = '';
              if (norm) { const nr = normaliseRow(norm.calc, sm); if (!nr.missing) vol = `${fv(nr.dna)} µL DNA${nr.dil > 1 ? ` (of 1:${nr.dil})` : ''} + ${fv(nr.water)} µL water (${fv(nr.ng)} ng)`; }
              const fm = flat().find((x) => x.calc && x.calc.type === 'fmolNorm' && x.calc.readingKey === r.key);
              if (fm) { const fr = fmolRow(fm.calc, sm); if (!fr.missing) vol = `${fv(fr.dna)} µL DNA + ${fv(fr.water)} µL water (${fv(fr.fmol)} fmol, ${fv(fr.ng)} ng)`; }
              const inp = flat().find((x) => x.calc && x.calc.type === 'input' && x.calc.readingKey === r.key);
              if (inp) { const ir = inputOf(inp.calc, sm); if (!ir.missing) vol = `${fv(ir.vol)} µL DNA + ${fv(ir.water)} µL water${ir.ng != null ? ` (${fv(ir.ng)} ng)` : ''}`; }
              add(s.id, r.key, sec, 'Result', type, sm.name, v, r.unit, vol, '', r.chain === false ? '' : fromS, r.noTube ? '' : tubeL(s.id, 'sample', sm));
            });
            if (r.chain !== false) prevSampleSection = sec;
          }
        });
        if (s.calc && s.calc.type === 'barcodes' && s.exportSection) {
          samples().forEach((sm) => add(s.id, null, s.exportSection, 'Result', 'General', sm.name, sm.barcode, '', '', '', prevSampleSection, tubeL(s.id, 'sample', sm)));
          prevSampleSection = s.exportSection;
        }
        if (s.calc && s.calc.type === 'loading' && s.exportSection) {
          const d = calcData(s);
          if (d) { add(s.id, null, s.exportSection, 'Result', 'General', 'Pool', fv(d.loaded), 'fmol', `${fv(d.lib)} µL library + ${fv(d.eb)} µL EB`, '', prevPoolSection, tubeL(s.id, 'pool')); prevPoolSection = s.exportSection; }
        }
        const pooledNote = readingsOf(s)[0] && readingsOf(s)[0].per === 'pool' && state.readings[readingsOf(s)[0].key] && state.readings[readingsOf(s)[0].key].pool;
        if (state.skipped[s.id] || (note && !pooledNote)) log.push(row([0, ...when(s.id), 'Protocol log', 'Note', '', '', '', '', '', '', '', `Step ${stepNo(s.id)} (${s.stage.title})${state.skipped[s.id] ? ' skipped' : ''}: ${note || strip(s.text)}`, '']));
      });
      state.redos.forEach((r) => { const d = new Date(r.at); log.push(row([0, isoDate(d), hm(d), 'Protocol log', 'Note', '', '', '', '', '', '', '', `Step ${stepNo(r.from)}: ${redoText(r)}`, ''])); });
      stages().forEach((stg) => {
        const times = stg.steps.map((s) => state.done[s.id]).filter(Boolean);
        if (times.length === stg.steps.length) {
          const d = new Date(Math.max(...times));
          log.push(row([0, isoDate(d), hm(d), 'Protocol log', 'Note', '', '', '', '', '', '', '', `${stg.title}: all ${stg.steps.length} steps done`, '']));
        }
      });
      log.forEach((l) => lines.push(l.replace(/^0,/, `${++k},`)));
      return '\ufeff' + lines.join('\r\n');
    }

    /* ================= sample journey =================
       One condensed page per run: each sample's readings in protocol order, then the pool and library, then notes. */
    function journeyData() {
      const steps = flat(), cols = [], pool = [];
      const normAny = steps.find((x) => x.calc && x.calc.type === 'normalise');
      steps.forEach((s) => {
        readingsOf(s).forEach((r) => {
          if (r.noExport) return;
          if (r.per === 'pool') {
            const v = rd(r.key, 'pool');
            const rec = steps.find((x) => x.calc && x.calc.type === 'recovery' && x.calc.per === 'pool' && x.calc.readingKey === r.key);
            pool.push({ label: r.short || r.label, v: v == null ? null : `${fv(v)} ${r.unit}`, sub: rec && v != null ? `${fv(v * rec.calc.eluate)} ng in ${rec.calc.eluate} µL` : '' });
            return;
          }
          const norm = steps.find((x) => x.calc && x.calc.type === 'normalise' && x.calc.readingKey === r.key);
          const rec = steps.find((x) => x.calc && x.calc.type === 'recovery' && x.calc.per !== 'pool' && x.calc.readingKey === r.key);
          const yl = steps.find((x) => x.calc && x.calc.type === 'yield' && x.calc.readingKey === r.key);
          const fm = steps.find((x) => x.calc && x.calc.type === 'fmolNorm' && x.calc.readingKey === r.key);
          const inp = steps.find((x) => x.calc && x.calc.type === 'input' && x.calc.readingKey === r.key);
          cols.push({ label: r.short || r.label, cell: (sm) => {
            const q = rd(r.key, sm.id); if (q == null) return { v: null };
            let sub = '', bad = false;
            if (norm) { const nr = normaliseRow(norm.calc, sm); if (!nr.missing) { sub = `${fv(nr.ng)} ng used${nr.dil > 1 ? ` · 1:${nr.dil}` : ''}`; bad = nr.bad || !!nr.flag && nr.dna > norm.calc.finalVol - 0.001; } }
            if (fm) { const fr = fmolRow(fm.calc, sm); if (!fr.missing) { sub = `${fv(fr.fmol)} fmol · ${fv(fr.ng)} ng in`; bad = fr.bad; } }
            if (inp) { const ir = inputOf(inp.calc, sm); if (!ir.missing) sub = ir.ng != null ? `${fv(ir.ng)} ng in` : `${fv(ir.vol)} µL in`; }
            if (yl) { sub = `${fv(q * yl.calc.eluate)} ng total`; bad = yl.calc.minNg != null && q * yl.calc.eluate < yl.calc.minNg; }
            if (rec) {
              const inR = normAny ? normaliseRow(normAny.calc, sm) : null, inNg = inR && !inR.missing ? inR.ng : prm('inputNg');
              const pct = inNg ? q * rec.calc.eluate / inNg * 100 : null;
              sub = `${fv(q * rec.calc.eluate)} ng${pct != null ? ` · ${fv(pct)}%` : ''}`; bad = pct != null && pct < 40;
            }
            return { v: `${fv(q)} ${r.unit}`, sub, bad };
          } });
        });
        if (s.calc && s.calc.type === 'barcodes') cols.push({ label: P().barcodeLabel || 'Barcode', cell: (sm) => ({ v: sm.barcode, sub: '' }) });
        if (s.calc && s.calc.type === 'loading') {
          const d = rd(s.calc.readingKey, 'pool') != null ? calcData(s) : null;
          pool.push({ label: 'Loaded', v: d ? `${fv(d.loaded)} fmol` : null, sub: d ? `${fv(d.lib)} µL library + ${fv(d.eb)} µL EB` : '' });
        }
      });
      const all = flat(), done = all.filter((x) => state.done[x.id]).length, p = P();
      const notes = all.filter((x) => state.notes[x.id] || state.skipped[x.id])
        .map((x) => ({ no: stepNo(x.id), skipped: !!state.skipped[x.id], text: `${x.stage.title}${state.skipped[x.id] ? ' · skipped' : ''}: ${state.notes[x.id] || strip(x.text)}` }))
        .concat(state.redos.map((r) => ({ no: stepNo(r.from), skipped: true, text: (r.kind === 'added' ? '' : '↺ ') + redoText(r) })))
        .sort((a, b) => a.no - b.no);
      const meta = [p.name + ' (' + p.kit + ')', state.operator ? 'operator ' + state.operator : '', 'started ' + when(Date.parse(state.started)),
        ...(p.choices || []).map((c) => (c.label || 'choice').toLowerCase() + ' ' + choiceOpt(c.key).label.toLowerCase()), `${done}/${all.length} steps done`].filter(Boolean).join(' · ');
      const legend = flat().filter((x) => x.tube).map((x) => `${x.tube.suffix} = ${fillBc(x.tube.what, null)} (step ${stepNo(x.id)})`).join(' · ');
      const chain = (sid) => state.tubeLog.filter((x) => x.sid === sid).sort((a, b) => a.at - b.at || a.stepNo - b.stepNo).map((x) => ({ label: x.label, what: x.what, step: x.stepNo, keep: x.keep, side: x.side || !!((flat().find((st) => st.id === x.step) || {}).tube || {}).side, redone: x.status === 'redone', at: x.at }));
      const tubes = { legend, rows: samples().map((sm) => ({ name: sm.name, chain: [{ label: codeOf(sm), what: 'original sample', step: 0 }, ...chain(sm.id)] })), pool: chain('pool') };
      return { title: state.runName, meta, cols, pool, notes, tubes, rows: samples().map((sm) => ({ name: sm.name, cells: cols.map((c) => c.cell(sm)) })) };
    }
    function renderJourney() {
      const d = journeyData();
      const cell = (c) => c.v == null ? '<td class="dim">–</td>' : `<td class="${c.bad ? 'jbad' : ''}"><span class="jv">${esc(c.v)}</span>${c.sub ? `<span class="js">${esc(c.sub)}</span>` : ''}</td>`;
      $('app').innerHTML = `<div class="journey">
        <div class="row" style="justify-content:space-between;align-items:baseline"><h1 style="margin:0">Sample journey</h1>
          <div class="row"><button class="btn primary" data-act="journey-png">download picture</button><button class="btn" data-act="export-csv">LabTrack .csv</button><button class="btn" data-act="view" data-view="steps">← steps</button></div></div>
        <p class="muted" style="margin:6px 0 0"><b>${esc(d.title)}</b> · ${esc(d.meta)}</p>
        <div class="card"><h3>Samples</h3><div class="tbl-wrap"><table class="jt"><tr><th>Sample</th>${d.cols.map((c) => `<th>${esc(c.label)}</th>`).join('')}</tr>
          ${d.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td>${r.cells.map(cell).join('')}</tr>`).join('')}</table></div>
          <p class="dim" style="font-size:12px;margin:8px 0 0">Under each reading: ng used for the input, or ng recovered and % of the input after a clean-up. Red = under 40% recovered or short of the input mass.</p></div>
        <div class="card"><h3>Pool → library</h3><div class="strip">${d.pool.map((n, i) => `${i ? '<span class="arrow">→</span>' : ''}<div class="node"><div class="js">${esc(n.label)}</div><div class="jv">${n.v == null ? '–' : esc(n.v)}</div>${n.sub ? `<div class="js">${esc(n.sub)}</div>` : ''}</div>`).join('')}</div></div>
        <div class="card"><h3>Tubes</h3>
          <div class="tbl-wrap"><table class="jt tubes">${d.tubes.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${r.chain.filter((t) => !t.side).map((t) => `<span class="tcode${t.keep ? ' keep' : ''}${t.redone ? ' redone' : ''}" title="${esc(t.what)}${t.step ? ' · step ' + t.step : ''}${t.at ? ' · ' + esc(when(t.at)) : ''}${t.redone ? ' · redone' : ''}">${esc(t.label)}</span>`).join('<span class="arrow">→</span>')}${r.chain.some((t) => t.side) ? `<span class="dim" style="margin-left:10px">side:</span> ${r.chain.filter((t) => t.side).map((t) => `<span class="tcode${t.keep ? ' keep' : ''}${t.redone ? ' redone' : ''}" title="${esc(t.what)} · step ${t.step}">${esc(t.label)}</span>`).join(' ')}` : ''}</td></tr>`).join('')}
            <tr><td><b>Pool</b></td><td>${d.tubes.pool.length ? d.tubes.pool.map((t) => `<span class="tcode${t.keep ? ' keep' : ''}${t.redone ? ' redone' : ''}" title="${esc(t.what)}${t.step ? ' · step ' + t.step : ''}${t.at ? ' · ' + esc(when(t.at)) : ''}${t.redone ? ' · redone' : ''}">${esc(t.label)}</span>`).join('<span class="arrow">→</span>') : '<span class="dim">not pooled yet</span>'}</td></tr></table></div>
          <p class="dim" style="font-size:12px;margin:8px 0 0">${esc(d.tubes.legend)}. Outlined = a tube you keep. Crossed out = redone (first try).</p></div>
        <div class="card"><h3>Notes &amp; deviations</h3>${d.notes.length ? `<ul class="jnotes">${d.notes.map((n) => `<li><b>Step ${n.no}</b> · ${esc(n.text)}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">None recorded.</p>'}</div>
      </div>`;
      renderTop(); renderDock();
    }
    // The same page as a picture: an SVG drawn from journeyData(), turned into a PNG.
    function journeySvg() {
      const d = journeyData(), css = getComputedStyle(document.documentElement), C = (n) => css.getPropertyValue('--' + n).trim();
      const F = "JetBrains Mono, Menlo, Consolas, monospace", xml = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const pad = 28, nameW = 150, colW = 150, rowH = 42;
      const W = Math.max(820, pad * 2 + nameW + d.cols.length * colW);
      const fit = (t, w, size) => { t = String(t); const max = Math.floor(w / (size * 0.62)); return t.length > max ? t.slice(0, max - 1) + '…' : t; };
      const T = (x, y, t, size, fill, weight = 400) => `<text x="${x}" y="${y}" font-family="${F}" font-size="${size}" font-weight="${weight}" fill="${fill}">${xml(t)}</text>`;
      const o = []; let y = pad;
      o.push(T(pad, y + 20, fit('Sample journey · ' + d.title, W - 2 * pad, 20), 20, C('text'), 800)); y += 34;
      const perMeta = Math.floor((W - 2 * pad) / (12 * 0.62));
      for (let m = d.meta; m.length; ) {
        let cut = m.length <= perMeta ? m.length : m.lastIndexOf(' · ', perMeta); if (cut <= 0) cut = perMeta;
        o.push(T(pad, y + 12, m.slice(0, cut), 12, C('muted'))); y += 17; m = m.slice(cut).replace(/^ · /, '');
      }
      y += 15;
      o.push(T(pad, y + 12, 'Sample', 11, C('muted'), 700));
      d.cols.forEach((c, i) => o.push(T(pad + nameW + i * colW, y + 12, fit(c.label, colW - 10, 11), 11, C('muted'), 700)));
      y += 20; o.push(`<rect x="${pad}" y="${y}" width="${W - 2 * pad}" height="1" fill="${C('border-2')}"/>`);
      d.rows.forEach((r, k) => {
        if (k % 2) o.push(`<rect x="${pad}" y="${y + 1}" width="${W - 2 * pad}" height="${rowH}" fill="${C('panel-2')}"/>`);
        o.push(T(pad + 6, y + 26, fit(r.name, nameW - 12, 13), 13, C('text'), 700));
        r.cells.forEach((c, i) => {
          const x = pad + nameW + i * colW;
          o.push(T(x, y + 19, c.v == null ? '–' : fit(c.v, colW - 10, 13), 13, c.v == null ? C('dim') : C('text'), 700));
          if (c.sub) o.push(T(x, y + 34, fit(c.sub, colW - 10, 10), 10, c.bad ? C('red') : C('muted')));
        });
        y += rowH;
      });
      y += 26; o.push(T(pad, y, 'Pool → library', 14, C('text'), 800)); y += 12;
      const gap = 26, nodeH = 58, nodeW = Math.max(130, Math.min(190, (W - 2 * pad - gap * (d.pool.length - 1)) / d.pool.length)); let x = pad;
      d.pool.forEach((n, i) => {
        if (x + nodeW > W - pad) { x = pad; y += nodeH + 12; }
        else if (i) o.push(T(x - gap + 6, y + 34, '→', 14, C('dim')));
        o.push(`<rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="10" fill="${C('panel')}" stroke="${C('border-2')}"/>`);
        o.push(T(x + 10, y + 17, fit(n.label, nodeW - 20, 10), 10, C('muted')));
        o.push(T(x + 10, y + 35, n.v == null ? '–' : fit(n.v, nodeW - 20, 14), 14, C('text'), 800));
        if (n.sub) o.push(T(x + 10, y + 50, fit(n.sub, nodeW - 20, 9.5), 9.5, C('muted')));
        x += nodeW + gap;
      });
      y += nodeH + 30; o.push(T(pad, y, 'Tubes', 14, C('text'), 800)); y += 6;
      const tl = (ch) => (ch.filter((t) => !t.side).map((t) => t.label + (t.redone ? ' (redone)' : '')).join(' → ') || '–') + (ch.some((t) => t.side) ? '   · side: ' + ch.filter((t) => t.side).map((t) => t.label).join(', ') : '');
      [...d.tubes.rows.map((r) => [r.name, tl(r.chain)]), ['Pool', tl(d.tubes.pool)]].forEach(([n, t]) => {
        y += 18; o.push(T(pad + 6, y, fit(n, nameW - 12, 11), 11, C('text'), 700)); o.push(T(pad + nameW, y, fit(t, W - 2 * pad - nameW, 11), 11, C('muted')));
      });
      y += 30; o.push(T(pad, y, 'Notes & deviations', 14, C('text'), 800)); y += 8;
      const per = Math.floor((W - 2 * pad) / (11 * 0.62));
      (d.notes.length ? d.notes : [{ no: 0, text: 'None recorded.' }]).forEach((n) => {
        let t = (n.no ? `Step ${n.no} · ` : '') + n.text;
        while (t.length) { y += 17; o.push(T(pad, y, t.slice(0, per), 11, n.skipped ? C('amber') : C('text'))); t = t.slice(per); }
      });
      y += 30; o.push(T(pad, y, `LabTrack Bench · exported ${isoDate(new Date())} ${hm(new Date())}`, 10, C('dim')));
      const H = y + pad;
      return { W, H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${C('bg')}"/>${o.join('')}</svg>` };
    }
    function downloadJourneyPng() {
      const { W, H, svg } = journeySvg(), img = new Image(), name = `${fileBase()}_journey.png`;
      img.onload = () => {
        const cv = document.createElement('canvas'), k = 2; cv.width = W * k; cv.height = H * k;
        const g = cv.getContext('2d'); g.scale(k, k); g.drawImage(img, 0, 0);
        cv.toBlob((b) => { if (b) { download(name, b); toast('Picture downloaded', 'ok'); } else toast('Could not make the picture.'); }, 'image/png');
      };
      img.onerror = () => toast('Could not make the picture.');
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    /* ================= events ================= */
    function render() { if (state) renderRun(); else renderSetup(); }
    function list() { return state ? state.samples : draft.samples; }
    function rerenderSamples() {
      const box = $('sampleBox'); if (box) box.innerHTML = samplesTable(list(), P(), !state);
      if (state) { save(); renderRun(); }
    }

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act],[data-tact],[data-jump]'); if (!el) return;
      if (el.dataset.tact) { e.stopPropagation(); return timerAct(el.dataset.tact, el.dataset.t); }
      if (el.dataset.jump && !el.dataset.act) return scrollToStep(el.dataset.jump);
      const act = el.dataset.act, id = el.dataset.step;
      switch (act) {
        case 'check': {
          const wasNext = nextStep() && nextStep().id === id;
          if (state.done[id]) { if (!state.skipped[id]) unlogTubes(id, state.samples); delete state.done[id]; delete state.skipped[id]; openDone.delete(id); }
          else {
            state.done[id] = Date.now(); logTubes(id, state.samples.filter((sm) => !activeRedos().some((r) => r.sids.includes(sm.id) && !r.all && stepIdx(id) <= stepIdx(r.steps[r.steps.length - 1]))));
            const st = flat().find((s) => s.id === id), m = missingReadings(st);
            if (m) toast(`Step ${stepNo(id)} checked with ${m} reading${m > 1 ? 's' : ''} still empty.`);
          }
          save(); renderRun();
          if (wasNext && state.done[id]) { const n = nextStep(); if (n) setTimeout(() => scrollToStep(n.id), 60); }
          break;
        }
        case 'redo': redoDialog(id); break;
        case 'redo-go': {
          const why = ($('redoWhy').value || '').trim();
          if (!why) { $('redoWhy').focus(); return toast('Say what went wrong: it goes into the notes.'); }
          const boxes = [...document.querySelectorAll('[data-rsid]')], ticked = boxes.filter((b) => b.checked).map((b) => b.dataset.rsid);
          if (boxes.length && !ticked.length) return toast('Tick at least one sample.');
          const r = startRedo(id, !boxes.length || ticked.length === boxes.length ? 'all' : ticked, why);
          $('dlg').close(); renderRun();
          if (r.all) { scrollToStep(r.from); toast(`Back to step ${stepNo(r.from)}. New tubes get -R labels.`, 'ok', 4000); }
          else if (r.steps.length) { const p = $('redo-' + r.id); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); toast(`Catch-up list made for ${esc(redoNames(r))}.`, 'ok', 4000); }
          else { scrollToStep(r.from); toast(`New tubes for ${esc(redoNames(r))} get -R labels at this step.`, 'ok', 4000); }
          break;
        }
        case 'redo-cancel': { const r = state.redos.find((x) => x.id === el.dataset.rid); if (r && confirm('Cancel this redo? The first try goes back to how it was.')) cancelRedo(r); break; }
        case 'rcheck': {
          const r = state.redos.find((x) => x.id === el.dataset.rid); if (!r) return;
          const list = state.samples.filter((s) => r.sids.includes(s.id));
          if (r.done[id]) { withScope(r.sids, () => unlogTubes(id, list)); delete r.done[id]; }
          else {
            r.done[id] = Date.now(); withScope(r.sids, () => logTubes(id, list));
            const m = withScope(r.sids, () => missingReadings(flat().find((s) => s.id === id)));
            if (m) toast(`Step ${stepNo(id)} checked with ${m} reading${m > 1 ? 's' : ''} still empty.`);
          }
          save(); renderRun();
          if (!activeRedos().includes(r)) toast(`${esc(redoNames(r))} caught up with the run.`, 'ok');
          else { const nx = r.steps.find((s) => !r.done[s]); const e2 = nx && document.getElementById(`r-${r.id}-${nx}`); if (e2) e2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          break;
        }
        case 'expand': openDone.has(id) ? openDone.delete(id) : openDone.add(id); renderRun(); break;
        case 'note': openNotes.add(id); renderRun(); { const t = document.querySelector(`[data-note="${id}"]`); if (t) t.focus(); } break;
        case 'jump': { const n = nextStep(); if (n) scrollToStep(n.id); break; }
        case 'pick': {
          draft.protocolId = el.dataset.pid; draft.choices = defaultChoices(P()); draft.params = {};
          if (draft.runName === draft.autoName) draft.runName = draft.autoName = defaultRunName(P());   // follow the protocol unless renamed
          draft.samples.forEach((sm, i) => { sm.barcode = P().barcodes ? P().barcodes[i] || '' : ''; });
          if (P().maxSamples && draft.samples.length > P().maxSamples) draft.samples.length = P().maxSamples;
          renderSetup(); break;
        }
        case 'choose': {
          const tgt = state || draft; tgt.choices = Object.assign({}, tgt.choices, { [el.dataset.key]: el.dataset.val });
          if (state) { save(); renderRun(); settingsDialog(); } else renderSetup();
          break;
        }
        case 'start': startRun(); break;
        case 'add-sample': {
          const L = list(), p = P();
          if (p.maxSamples && L.length >= p.maxSamples) return toast(`This kit takes up to ${p.maxSamples} samples.`);
          const last = L[L.length - 1], m = last && last.name.match(/^(.*?)(\d+)$/);
          L.push({ id: uid(), name: m ? m[1] + (+m[2] + 1) : `Sample ${L.length + 1}`, code: freeCode(L), barcode: freeBarcode(L, p), q: '' });
          if (state) addLateSample(L[L.length - 1]);
          rerenderSamples();
          const ins = document.querySelectorAll('#sampleBox input[data-sf="name"]'); if (ins.length) ins[ins.length - 1].focus();
          break;
        }
        case 'rm-sample': {
          const L = list(), i = L.findIndex((s) => s.id === el.dataset.sid);
          if (state && !confirm(`Remove ${L[i].name} and its readings?`)) return;
          L.splice(i, 1);
          if (state) { Object.values(state.readings).forEach((r) => { delete r[el.dataset.sid]; }); state.redos.forEach((r) => { r.sids = r.sids.filter((x) => x !== el.dataset.sid); }); state.redos = state.redos.filter((r) => r.all || r.sids.length); }
          rerenderSamples(); break;
        }
        case 'paste-samples': {
          const txt = prompt('Paste sample names, one per line (or separated by commas). They replace the current list.');
          if (!txt) return;
          const names = txt.split(/[\n,;\t]+/).map((x) => x.trim()).filter(Boolean);
          const p = P(), L = list(), out = [];
          names.slice(0, p.maxSamples || 999).forEach((n) => { const old = L.find((s) => s.name === n); out.push(old || { id: uid(), name: n, code: freeCode(out), barcode: freeBarcode(out, p), q: '' }); });
          L.splice(0, L.length, ...out);
          if (names.length > (p.maxSamples || 999)) toast(`Only the first ${p.maxSamples} were kept.`);
          rerenderSamples(); break;
        }
        case 'samples': samplesDialog(); break;
        case 'settings': settingsDialog(); break;
        case 'export': exportDialog(); break;
        case 'close': $('dlg').close(); if (state) renderRun(); break;
        case 'export-csv': download(`${fileBase()}_labtrack.csv`, buildCsv(), 'text/csv'); toast('CSV downloaded', 'ok'); break;
        case 'export-json': {
          const r = el.dataset.rid ? db.runs[el.dataset.rid] : state; if (!r) return;
          download(`${fileBase(r)}_bench.json`, JSON.stringify(r, null, 2), 'application/json'); toast('Run file downloaded', 'ok'); break;
        }
        case 'journey-png': if ($('dlg').open) $('dlg').close(); downloadJourneyPng(); break;
        case 'view': view = el.dataset.view; renderRun(); window.scrollTo(0, 0); break;
        case 'open-run': openRun(el.dataset.rid); break;
        case 'close-run': {
          const running = Object.values(state.timers).some((t) => t.status === 'running');
          if (running && !confirm('A timer is still running. It keeps counting and rings when you open this run again. Close the run?')) return;
          closeRun(); toast('Run saved. Continue it any time from this list.', 'ok'); break;
        }
        case 'delete-run': {
          const r = el.dataset.rid ? db.runs[el.dataset.rid] : state; if (!r) return;
          if (!confirm(`Delete "${r.runName}" from this device? This can't be undone. Download its run file first if you want a copy.`)) return;
          delete db.runs[r.id];
          if (state && state.id === r.id) closeRun(); else { persist(); render(); }
          break;
        }
        case 'skip': {
          const wasNext = nextStep() && nextStep().id === id;
          state.done[id] = Date.now(); state.skipped[id] = true; openDone.add(id); openNotes.add(id);
          save(); renderRun();
          const t = document.querySelector(`[data-note="${id}"]`); if (t) t.focus({ preventScroll: true });
          toast(`Step ${stepNo(id)} skipped. Add a note saying why.`);
          if (wasNext) { const n = nextStep(); if (n) setTimeout(() => scrollToStep(n.id), 900); }
          break;
        }
        case 'print': $('dlg').close(); setTimeout(() => window.print(), 100); break;
        case 'import': {
          const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
          inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then((t) => {
            let r; try { r = JSON.parse(t); } catch (err) { r = null; }
            if (!isRun(r)) return toast('That is not a LabTrack Bench run file.');
            fixRun(r);
            const have = db.runs[r.id];
            if (have && !confirm(`"${have.runName}" is already on this device (saved ${when(have.updated)}). Replace it with the file (saved ${when(r.updated)})?\n\nCancel keeps both.`)) { r.id = uid(); r.runName += ' (copy)'; }
            db.runs[r.id] = r; persist(); openRun(r.id); toast('Run opened. Carry on from the highlighted step.', 'ok');
          }); };
          inp.click(); break;
        }
        case 'uncheck-all': if (confirm('Uncheck every step? Readings and notes are kept.')) { state.done = {}; save(); $('dlg').close(); renderRun(); } break;
        case 'theme': {
          const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next; try { localStorage.setItem('labtrack_theme', next); } catch (err) {}
          break;
        }
      }
    });

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.reading) {
        const k = t.dataset.reading; state.readings[k] = state.readings[k] || {};
        if (t.value.trim() === '') delete state.readings[k][t.dataset.sid]; else state.readings[k][t.dataset.sid] = t.value.trim();
        state.readAt[k] = Date.now(); save(); refreshCalcs();
      } else if (t.dataset.note) { state.notes[t.dataset.note] = t.value; if (!t.value) delete state.notes[t.dataset.note]; save(); }
      else if (t.dataset.tubeq) $('tubeRes').innerHTML = findHTML(t.value);
      else if (t.dataset.df) draft[t.dataset.df] = t.value;
      else if (t.dataset.dp) { draft.params = draft.params || {}; draft.params[t.dataset.dp] = t.value; }
      else if (t.dataset.sf) {
        const s = list().find((x) => x.id === t.dataset.sid); if (!s) return;
        s[t.dataset.sf] = t.value;
        if (t.dataset.sf === 'barcode') rerenderSamples();
        else if (state) { save(); }
      } else if (t.dataset.param) { state.params[t.dataset.param] = t.value; save(); refreshCalcs(); }
      else if (t.dataset.sf2) {
        state[t.dataset.sf2] = t.type === 'checkbox' ? t.checked : t.value; save();
        if (t.dataset.sf2 === 'runName') $('runInfo').querySelector('b').textContent = t.value;
        if (t.dataset.sf2 === 'keepAwake') { if (t.checked) keepAwake(); else if (wakeLock) wakeLock.release(); }
      }
    });
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.barcode) { const s = state.samples.find((x) => x.id === t.dataset.barcode); if (s) { s.barcode = t.value; save(); renderRun(); } }
      if ((t.dataset.sf === 'name' || t.dataset.sf === 'code') && state) renderRun();
      if (t.dataset.sf === 'code') { const box = $('sampleBox'); if (box) box.innerHTML = samplesTable(list(), P(), !state); }
      if (t.dataset.sf2 === 'runCode') renderRun();
      if (t.dataset.dil) { const v = num(t.value); if (v && v > 1) state.dil[t.dataset.dil] = v; else delete state.dil[t.dataset.dil]; save(); refreshCalcs(); }
    });
    $('dlg').addEventListener('close', () => { if (state) renderRun(); });
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (e.key === 'Enter' && t.dataset && t.dataset.sf === 'name') {
        e.preventDefault();
        const ins = [...document.querySelectorAll('#sampleBox input[data-sf="name"]')], i = ins.indexOf(t);
        if (i < ins.length - 1) ins[i + 1].focus(); else document.querySelector('#sampleBox [data-act="add-sample"]').click();
      }
      if (e.key === 'Enter' && t.dataset && t.dataset.dil) { e.preventDefault(); t.blur(); }
      if (e.key === 'Enter' && t.dataset && t.dataset.reading) {
        e.preventDefault();
        const ins = [...document.querySelectorAll(`input[data-reading="${t.dataset.reading}"]`)], i = ins.indexOf(t);
        if (i < ins.length - 1) ins[i + 1].focus(); else t.blur();
      }
    });

    if (state) openRun(state.id); else render();   // a page load continues the open run where it was left
    setInterval(tick, 250);
    tick();
  })();
  </script>
</body>
</html>
